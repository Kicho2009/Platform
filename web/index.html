<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vayansh's Birthday Invitation</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="welcome-screen" class="screen active">
    <div class="welcome-content">
      <h1 class="welcome-title">HELLO, WELCOME!</h1>
      <img src="vayansh.png" alt="Vayansh" class="baby-img">
      <button id="start-btn" class="knock-btn">SAY KNOCK KNOCK!</button>
    </div>
  </div>

  <div id="video-screen" class="screen">
    <video id="invitation-video" playsinline>
      <source src="Sequence 01_2.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div id="location-screen" class="screen">
    <a href="https://www.google.com/maps/place/Skilpad+Academy+%26+Turf/@12.9511135,80.1862958,17.38z/data=!4m6!3m5!1s0x3a525dbe6b5f0795:0x58f4817d0e5d87fa!8m2!3d12.9513824!4d80.1891065!16s%2Fg%2F11xfrqdyw7?entry=ttu&g_ep=EgoyMDI2MDQyOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="location-card-link">
      <div class="location-card">
          <img src="vayansh.png" alt="Vayansh" class="location-baby-img">
          <h2>We can't wait to see you!</h2>
          <p>Tap here to see the location on Google Maps!</p>
          <div class="map-icon">📍</div>
      </div>
    </a>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
